<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Pointage - École de danse</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>


  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      text-align: center;
    }

    h1 {
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
      padding: 15px;
      margin: 8px auto;
      font-size: 18px;
      border-radius: 10px;
    }

    button {
      border: none;
      background: #222;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #stop {
      display: none;
      background: #777;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #message {
      max-width: 500px;
      margin: 20px auto;
      padding: 18px;
      border-radius: 10px;
      background: white;
      line-height: 1.5;
    }

    .info {
      background: #e5efff !important;
    }

    .success {
      background: #dff5df !important;
      color: #145214;
    }

    .error {
      background: #ffe0e0 !important;
      color: #8b0000;
    }

    .warning {
      background: #fff2cc !important;
      color: #765600;
    }

    .nom {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .credits {
      font-size: 22px;
      font-weight: bold;
      margin-top: 10px;
    }


    /* ==================================================
       SELECTION ELEVE / COURS
       ================================================== */

    .selection-container {
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
      margin: 20px auto;
      padding: 18px;
      background: white;
      border-radius: 12px;
      text-align: left;
    }

    .selection-container h2 {
      text-align: center;
      margin-top: 0;
    }

    .info-carte {
      padding: 12px;
      border-radius: 8px;
      background: #e5efff;
      text-align: center;
      line-height: 1.5;
    }

    .eleve-selection {
      margin-top: 18px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fafafa;
    }

    .eleve-selection h3 {
      margin: 0 0 12px 0;
      font-size: 19px;
    }

    .cours-eleve {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cours-checkbox {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      box-sizing: border-box;
    }

    .cours-checkbox:hover {
      background: #f5f5f5;
    }

    .cours-checkbox input {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .cours-info {
      flex: 1;
      line-height: 1.35;
    }

    .cours-nom {
      font-weight: bold;
    }

    .cours-horaire {
      font-size: 14px;
      color: #666;
    }

    .resume-selection {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #e9f7ef;
      text-align: center;
      line-height: 1.5;
      font-size: 17px;
    }

    .btn-success {
      background: #238636;
    }

    .btn-secondary {
      background: #777;
    }

    .bouton-selection {
      margin-top: 10px;
    }

  </style>

</head>


<body>

  <h1>💃 Pointage des cartes d'abonnement</h1>


  <!-- ==================================================
       SELECTION APRES SCAN
       ================================================== -->

  <div id="selectionApresScan"
       class="selection-container"
       style="display:none;">

    <h2>👥 Présences</h2>

    <p id="infoCarte"
       class="info-carte"></p>

    <div id="elevesCoursContainer"></div>

    <div id="resumeSelection"
         class="resume-selection">

      0 présence à enregistrer — 0 crédit sera débité

    </div>

    <button id="btnValiderSelection"
            class="btn-success"
            disabled>

      ✅ Valider les présences

    </button>

    <button id="btnAnnulerSelection"
            class="btn-secondary">

      ↩️ Annuler

    </button>

  </div>


  <!-- ==================================================
       CONTROLES SCANNER
       ================================================== -->

  <button id="start"
          onclick="demarrer()">

    📷 Autoriser la caméra

  </button>


  <button id="stop"
          onclick="arreter()">

    ⛔ Arrêter le scanner

  </button>


  <div id="reader"></div>


  <div id="message"
       class="info">

    Appuyez sur
    <strong>« 📷 Autoriser la caméra »</strong>
    puis présentez le QR code devant la caméra.

  </div>


<script>


/* ==================================================
1.   CONFIGURATION
================================================== */


/*
 * Adresse de ton Apps Script.
 */
const API_URL =
  "https://script.google.com/macros/s/AKfycbz-tig9GMgWGbCq7iuiiM_d68Z4z9GxPtbOinDMYksWhqR4-VCOb23UmrmT3mjeKHZm/exec";


let scanner = null;

let scannerActif = false;

/*
 * Verrou général du scanner.
 *
 * true = aucun nouveau QR ne doit être traité.
 */
let traitement = false;


/*
 * true = l'utilisateur est actuellement
 * en train de choisir les élèves et les cours.
 */
let selectionEnCours = false;


/*
 * Données retournées par Apps Script
 * après le scan.
 */
let donneesScan = null;


/*
 * Structure :
 *
 * {
 *   "A002": ["C2", "C3"],
 *   "A003": ["C2"]
 * }
 *
 * Cela signifie :
 *
 * A002 -> C2 + C3
 * A003 -> C2
 */
let selectionElevesCours = {};


/* ==================================================
2.   AFFICHAGE DES MESSAGES
================================================== */

function message(texte, type) {

  const element =
    document.getElementById("message");

  element.className = "";

  if (type) {
    element.classList.add(type);
  }

  element.innerHTML = texte;
}


/* ==================================================
3.   DEMARRAGE DE LA CAMERA
================================================== */

function demarrer() {

  /*
   * IMPORTANT :
   * Il n'y a plus de sélection de cours ici.
   *
   * Le cours sera choisi APRÈS le scan,
   * individuellement pour chaque élève.
   */

  if (scannerActif) {
    return;
  }


  /*
   * Si une ancienne sélection existe,
   * on la ferme avant de démarrer.
   */
  fermerSelection();


  message(

    "📷 Demande d'autorisation de la caméra...<br><br>" +
    "Si Android affiche une demande, choisissez " +
    "<strong>Autoriser</strong>.",

    "info"

  );


  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {

    message(

      "❌ Votre navigateur ne permet pas l'accès à la caméra.",

      "error"

    );

    return;
  }


  navigator.mediaDevices.getUserMedia({

    video: {
      facingMode: {
        ideal: "environment"
      }
    },

    audio: false

  })


  .then(function(stream) {


    /*
     * Cette demande sert uniquement
     * à obtenir l'autorisation.
     *
     * Html5Qrcode ouvrira ensuite
     * sa propre caméra.
     */

    stream.getTracks().forEach(function(track) {
      track.stop();
    });


    message(

      "✅ Caméra autorisée.<br><br>" +
      "Démarrage du scanner...",

      "success"

    );


    setTimeout(function() {

      lancerScanner();

    }, 300);

  })


  .catch(function(error) {


    console.error(
      "Erreur autorisation caméra :",
      error
    );


    let texte =
      "❌ <strong>Impossible d'accéder à la caméra.</strong><br><br>";


    if (error.name === "NotAllowedError") {

      texte +=
        "L'accès à la caméra a été refusé. " +
        "Vérifiez l'autorisation de la caméra dans les réglages du navigateur.";

    }


    else if (error.name === "NotFoundError") {

      texte +=
        "Aucune caméra n'a été trouvée.";

    }


    else if (error.name === "NotReadableError") {

      texte +=
        "La caméra est déjà utilisée par une autre application.";

    }


    else if (error.name === "SecurityError") {

      texte +=
        "Le navigateur bloque l'accès à la caméra.";

    }


    else {

      texte +=
        "Erreur : " +
        error.name +
        "<br>" +
        error.message;

    }


    message(
      texte,
      "error"
    );

  });

}


/* ==================================================
4.   LANCEMENT DU SCANNER QR
================================================== */

function lancerScanner() {

  if (scannerActif) {
    return;
  }


  /*
   * Si un ancien objet existe encore,
   * on le supprime.
   */

  if (scanner) {

    try {
      scanner.clear();
    } catch (e) {}

    scanner = null;
  }


  scanner =
    new Html5Qrcode("reader");


  const configuration = {

    fps: 10,

    qrbox: function(width, height) {

      const taille =
        Math.min(width, height) * 0.75;

      return {

        width:
          Math.floor(taille),

        height:
          Math.floor(taille)

      };

    }

  };


  scanner.start(

    {
      facingMode: "environment"
    },

    configuration,


    function(qrCode) {


      /*
       * Si un traitement est déjà en cours,
       * on ignore complètement ce QR.
       */

      if (traitement) {
        return;
      }


      /*
       * VERROUILLAGE IMMÉDIAT
       */

      traitement = true;


      console.log(
        "QR détecté : scanner verrouillé."
      );


      traiterQR(qrCode);

    },


    function() {

      /*
       * Recherche permanente d'un QR.
       * Rien à faire ici.
       */

    }

  )


  .then(function() {


    scannerActif = true;


    document.getElementById("start")
      .style.display = "none";


    document.getElementById("stop")
      .style.display = "block";


    message(

      "📷 <strong>Scanner actif</strong><br><br>" +
      "Présentez le QR code devant la caméra.",

      "info"

    );

  })


  .catch(function(error) {


    console.error(
      "Erreur lancement scanner :",
      error
    );


    scannerActif = false;
    traitement = false;
    scanner = null;


    document.getElementById("start")
      .style.display = "block";


    document.getElementById("stop")
      .style.display = "none";


    message(

      "❌ <strong>Impossible de démarrer le scanner.</strong><br><br>" +
      String(error),

      "error"

    );

  });

}


/* ==================================================
5.   TRAITEMENT DU QR
================================================== */

function traiterQR(token) {


  message(

    "⏳ <strong>Lecture du QR code...</strong><br><br>" +
    "Recherche de la carte et des élèves associés.",

    "info"

  );


  const callbackName =
    "reponseEleve_" +
    Date.now();


  let termine = false;


  window[callbackName] =
    function(resultat) {


      /*
       * Protection contre une double réponse.
       */

      if (termine) {
        return;
      }


      termine = true;


      console.log(
        "Réponse Apps Script :",
        resultat
      );


      nettoyerJSONP();


      if (!resultat) {

        message(
          "❌ Réponse vide du serveur.",
          "error"
        );

        libererScannerDans6Secondes();

        return;
      }


      /*
       * Si le QR n'est pas valide ou si la carte
       * n'est pas disponible, on affiche l'erreur.
       */

      if (!resultat.success) {

        afficherResultat(resultat);

        libererScannerDans6Secondes();

        return;
      }


      /*
       * Le QR est reconnu.
       *
       * On ne valide PAS encore la présence.
       *
       * On affiche maintenant la sélection
       * élève × cours.
       */

      afficherSelectionApresScan(resultat);

    };


  const url =
    API_URL +
    "?action=eleve" +
    "&token=" +
    encodeURIComponent(token) +
    "&callback=" +
    encodeURIComponent(callbackName);


  const script =
    document.createElement("script");


  script.src = url;


  script.onerror =
    function() {


      if (termine) {
        return;
      }


      termine = true;


      console.error(
        "Erreur de communication avec Apps Script."
      );


      message(

        "❌ <strong>Impossible de contacter Google Sheets.</strong><br><br>" +
        "Vérifiez la connexion Internet.",

        "error"

      );


      nettoyerJSONP();


      libererScannerDans6Secondes();

    };


  function nettoyerJSONP() {

    try {
      delete window[callbackName];
    } catch (e) {}

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

  }


  document.body.appendChild(script);

}


/* ==================================================
6.   SELECTION ELEVE / COURS
================================================== */

function afficherSelectionApresScan(resultat) {


  donneesScan = resultat;

  selectionElevesCours = {};

  selectionEnCours = true;


  const container =
    document.getElementById(
      "elevesCoursContainer"
    );


  const bloc =
    document.getElementById(
      "selectionApresScan"
    );


  const infoCarte =
    document.getElementById(
      "infoCarte"
    );


  container.innerHTML = "";


  /*
   * Informations générales de la carte.
   */

  infoCarte.innerHTML =

    "Carte <strong>" +
    escapeHtml(resultat.idCarte || "") +
    "</strong><br>" +

    "Crédits restants : <strong>" +
    escapeHtml(String(resultat.creditsRestants || 0)) +
    "</strong>";


  const eleves =
    resultat.eleves || [];


  const cours =
    resultat.cours || [];


  if (eleves.length === 0) {

    message(
      "❌ Aucun élève associé à cette carte.",
      "error"
    );

    selectionEnCours = false;

    libererScannerDans6Secondes();

    return;
  }


  if (cours.length === 0) {

    message(
      "❌ Aucun cours disponible.",
      "error"
    );

    selectionEnCours = false;

    libererScannerDans6Secondes();

    return;
  }


  /*
   * Création d'un bloc par élève.
   */

  eleves.forEach(function(eleve) {


    selectionElevesCours[eleve.id] = [];


    const blocEleve =
      document.createElement("div");


    blocEleve.className =
      "eleve-selection";


    let html =

      "<h3>👤 " +
      escapeHtml(eleve.nomComplet) +
      "</h3>" +

      "<div class='cours-eleve'>";


    cours.forEach(function(c) {


      html +=

        "<label class='cours-checkbox'>" +

          "<input " +
            "type='checkbox' " +
            "class='checkbox-cours' " +
            "data-eleve='" +
              escapeHtml(eleve.id) +
            "' " +
            "data-cours='" +
              escapeHtml(c.id) +
            "' " +
            "onchange='modifierSelectionCours(this)'>" +

          "<span class='cours-info'>" +

            "<span class='cours-nom'>" +
              escapeHtml(c.nom) +
            "</span>" +

            "<br>" +

            "<span class='cours-horaire'>" +
              escapeHtml(c.horaire) +
            "</span>" +

          "</span>" +

        "</label>";

    });


    html +=
      "</div>";


    blocEleve.innerHTML = html;


    container.appendChild(blocEleve);

  });


  /*
   * Affichage du panneau.
   */

  bloc.style.display = "block";


  /*
   * Le scanner reste verrouillé pendant toute
   * la durée de cette sélection.
   */

  mettreAJourResumeSelection();

}


/* ==================================================
7.   MODIFICATION DE LA SELECTION
================================================== */

function modifierSelectionCours(checkbox) {


  const idEleve =
    checkbox.dataset.eleve;


  const idCours =
    checkbox.dataset.cours;


  if (!selectionElevesCours[idEleve]) {

    selectionElevesCours[idEleve] = [];

  }


  if (checkbox.checked) {


    if (
      !selectionElevesCours[idEleve]
        .includes(idCours)
    ) {

      selectionElevesCours[idEleve]
        .push(idCours);

    }

  }


  else {


    selectionElevesCours[idEleve] =

      selectionElevesCours[idEleve]
        .filter(function(id) {

          return id !== idCours;

        });

  }


  mettreAJourResumeSelection();

}


/* ==================================================
8.   CALCUL DU RESUME
================================================== */

function compterPresencesSelectionnees() {


  let nombre = 0;


  Object.keys(
    selectionElevesCours
  ).forEach(function(idEleve) {


    nombre +=
      selectionElevesCours[idEleve].length;

  });


  return nombre;

}


function mettreAJourResumeSelection() {


  const nombre =
    compterPresencesSelectionnees();


  const resume =
    document.getElementById(
      "resumeSelection"
    );


  const bouton =
    document.getElementById(
      "btnValiderSelection"
    );


  if (nombre === 0) {


    resume.innerHTML =
      "0 présence à enregistrer — " +
      "0 crédit sera débité";


    bouton.disabled = true;


    return;

  }


  const motPresence =
    nombre > 1
      ? "présences"
      : "présence";


  const motCredit =
    nombre > 1
      ? "crédits"
      : "crédit";


  resume.innerHTML =

    "<strong>" +
    nombre +
    " " +
    motPresence +
    "</strong> à enregistrer — " +

    "<strong>" +
    nombre +
    " " +
    motCredit +
    "</strong> seront débités";


  bouton.disabled = false;

}


/* ==================================================
9.   VALIDATION DE LA SELECTION
================================================== */

document.getElementById(
  "btnValiderSelection"
)
.addEventListener(
  "click",
  validerSelection
);


function validerSelection() {


  if (!donneesScan ||
      !donneesScan.success) {

    return;
  }


  const selections = [];


  /*
   * Construction de la liste exacte
   * élève + cours.
   */

  Object.keys(
    selectionElevesCours
  ).forEach(function(idEleve) {


    selectionElevesCours[idEleve]
      .forEach(function(idCours) {


        selections.push({

          idEleve: idEleve,

          idCours: idCours

        });

      });

  });


  if (selections.length === 0) {


    message(

      "⚠️ Veuillez sélectionner au moins " +
      "un cours pour un élève.",

      "warning"

    );


    return;

  }


  const bouton =
    document.getElementById(
      "btnValiderSelection"
    );


  bouton.disabled = true;

  bouton.textContent =
    "⏳ Validation en cours...";


  /*
   * Le scanner reste verrouillé.
   */

  traitement = true;


  const callbackName =
    "reponseValidation_" +
    Date.now();


  let termine = false;


  window[callbackName] =
    function(resultat) {


      if (termine) {
        return;
      }


      termine = true;


      nettoyerJSONP();


      console.log(
        "Réponse validation :",
        resultat
      );


      bouton.disabled = false;

      bouton.textContent =
        "✅ Valider les présences";


      if (resultat.success) {


        fermerSelection();


        afficherResultat(resultat);


        /*
         * On garde le scanner verrouillé
         * quelques secondes après validation.
         */

        libererScannerDans6Secondes();


      }


      else {


        /*
         * En cas d'erreur, on laisse la sélection
         * visible pour permettre une correction.
         */

        afficherResultat(resultat);


        bouton.disabled = false;

        bouton.textContent =
          "✅ Valider les présences";


        traitement = true;

      }

    };


  /*
   * On envoie également la sélection complète
   * sous forme JSON.
   */

  const url =
    API_URL +

    "?action=pointer" +

    "&token=" +
    encodeURIComponent(
      donneesScan.token
    ) +

    "&selection=" +
    encodeURIComponent(
      JSON.stringify(selections)
    ) +

    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  const script =
    document.createElement("script");


  script.src = url;


  script.onerror =
    function() {


      if (termine) {
        return;
      }


      termine = true;


      nettoyerJSONP();


      bouton.disabled = false;

      bouton.textContent =
        "✅ Valider les présences";


      message(

        "❌ <strong>Impossible de contacter Google Sheets.</strong><br><br>" +
        "Aucune modification n'a été effectuée.",

        "error"

      );


      /*
       * La sélection reste visible.
       */

      traitement = true;

    };


  function nettoyerJSONP() {


    try {
      delete window[callbackName];
    } catch (e) {}


    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

  }


  document.body.appendChild(script);

}


/* ==================================================
10.  ANNULATION DE LA SELECTION
================================================== */

document.getElementById(
  "btnAnnulerSelection"
)
.addEventListener(
  "click",
  annulerSelection
);


function annulerSelection() {


  fermerSelection();


  donneesScan = null;

  selectionElevesCours = {};

  selectionEnCours = false;


  /*
   * On conserve le scanner actif,
   * mais on attend quelques secondes
   * avant d'accepter un nouveau QR.
   */

  traitement = false;


  message(

    "📷 <strong>Prêt pour le prochain élève.</strong><br><br>" +
    "Présentez le QR code devant la caméra.",

    "info"

  );

}


function fermerSelection() {


  const bloc =
    document.getElementById(
      "selectionApresScan"
    );


  if (bloc) {
    bloc.style.display = "none";
  }


  const container =
    document.getElementById(
      "elevesCoursContainer"
    );


  if (container) {
    container.innerHTML = "";
  }


  selectionEnCours = false;

}


/* ==================================================
11.  DEVERROUILLAGE DU SCANNER
================================================== */

function libererScannerDans6Secondes() {


  console.log(
    "Scanner verrouillé pendant 6 secondes."
  );


  setTimeout(function() {


    /*
     * Si une sélection est encore ouverte,
     * surtout ne pas déverrouiller le scanner.
     */

    if (selectionEnCours) {

      console.log(
        "Sélection en cours : scanner toujours verrouillé."
      );

      return;

    }


    traitement = false;


    console.log(
      "Scanner à nouveau disponible."
    );


    if (scannerActif) {


      message(

        "📷 <strong>Prêt pour le prochain élève.</strong><br><br>" +
        "Présentez le QR code devant la caméra.",

        "info"

      );

    }

  }, 6000);

}


/* ==================================================
12.  AFFICHAGE DU RESULTAT
================================================== */

function afficherResultat(resultat) {


  if (!resultat) {


    message(

      "❌ Réponse vide du serveur.",

      "error"

    );


    return;

  }


  console.log(
    "Résultat :",
    resultat
  );


  /* -----------------------------------------------
     12.1. SCAN / VALIDATION VALIDE
  ------------------------------------------------ */

  if (resultat.success) {


    /*
     * Nouveau fonctionnement :
     * plusieurs élèves et plusieurs cours
     * peuvent être enregistrés en une seule fois.
     */

    let texte =

      "<div class='nom'>" +
      "✅ Présences validées" +
      "</div>" +

      "<strong>" +
      (resultat.message ||
       "Les présences ont été enregistrées.") +
      "</strong>" +

      "<br><br>";


    if (typeof resultat.nombrePresences !== "undefined") {

      texte +=

        "Présences enregistrées : <strong>" +
        resultat.nombrePresences +
        "</strong><br>";

    }


    if (typeof resultat.creditsConsommes !== "undefined") {

      texte +=

        "Crédits consommés : <strong>" +
        resultat.creditsConsommes +
        "</strong><br>";

    }


    if (typeof resultat.creditsApres !== "undefined") {

      texte +=

        "<div class='credits'>" +
        "Crédits restants : " +
        resultat.creditsApres +
        "</div>";

    }


    if (resultat.dateFin) {

      texte +=

        "<br>" +

        "Carte valable jusqu'au " +

        "<strong>" +

        resultat.dateFin +

        "</strong>";

    }


    message(
      texte,
      "success"
    );


    return;

  }


  /* -----------------------------------------------
     12.2. DOUBLE SCAN
  ------------------------------------------------ */

  if (resultat.type === "duplicate") {


    message(

      "⚠️ <strong>" +
      (resultat.eleve || "") +
      "</strong><br><br>" +

      resultat.message +

      (
        typeof resultat.credits !== "undefined"

        ?

        "<br><br>Crédits restants : " +
        resultat.credits

        :

        ""
      ),

      "warning"

    );


    return;

  }


  /* -----------------------------------------------
     12.3. CARTE EPUISEE
  ------------------------------------------------ */

  if (resultat.type === "empty") {


    message(

      "❌ <strong>" +
      (resultat.eleve || "") +
      "</strong><br><br>" +

      resultat.message,

      "error"

    );


    return;

  }


  /* -----------------------------------------------
     12.4. CARTE INEXISTANTE / HORS PERIODE
  ------------------------------------------------ */

  if (resultat.type === "expired") {


    message(

      "❌ <strong>" +
      (resultat.eleve || "") +
      "</strong><br><br>" +

      resultat.message,

      "error"

    );


    return;

  }


  /* -----------------------------------------------
     12.5. AUTRE ERREUR
  ------------------------------------------------ */

  message(

    "❌ " +
    (
      resultat.message ||
      "QR code refusé."
    ),

    "error"

  );

}


/* ==================================================
13.  ARRET DU SCANNER
================================================== */

function arreter() {


  fermerSelection();


  donneesScan = null;

  selectionElevesCours = {};

  selectionEnCours = false;


  if (!scanner || !scannerActif) {


    traitement = false;

    return;

  }


  scanner.stop()


  .then(function() {


    scanner.clear();


    scanner = null;

    scannerActif = false;

    traitement = false;


    document.getElementById("start")
      .style.display = "block";


    document.getElementById("stop")
      .style.display = "none";


    message(

      "Scanner arrêté.<br><br>" +
      "Vous pouvez redémarrer la caméra.",

      "info"

    );

  })


  .catch(function(error) {


    console.error(error);

  });

}


/* ==================================================
14.  SECURITE HTML
================================================== */

function escapeHtml(texte) {


  return String(texte || "")

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}
