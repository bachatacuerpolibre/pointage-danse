<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Pointage - École de danse</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>


  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      text-align: center;
    }

    h1 {
      margin-bottom: 25px;
    }

    select,
    button {
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
      padding: 15px;
      margin: 8px auto;
      font-size: 18px;
      border-radius: 10px;
    }

    select {
      border: 1px solid #ccc;
      background: white;
    }

    button {
      border: none;
      background: #222;
      color: white;
    }

    #stop {
      display: none;
      background: #777;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #message {
      max-width: 500px;
      margin: 20px auto;
      padding: 18px;
      border-radius: 10px;
      background: white;
      line-height: 1.5;
    }

    .info {
      background: #e5efff !important;
    }

    .success {
      background: #dff5df !important;
      color: #145214;
    }

    .error {
      background: #ffe0e0 !important;
      color: #8b0000;
    }

    .warning {
      background: #fff2cc !important;
      color: #765600;
    }

    .nom {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .credits {
      font-size: 22px;
      font-weight: bold;
      margin-top: 10px;
    }

  </style>

</head>


<body>

  <h1>💃 Pointage</h1>


  <p>
    <strong>Choisissez le cours :</strong>
  </p>


  <select id="cours">

    <option value="">
      Choisir un cours
    </option>

    <option value="C1">
      Bachata débutant 0 — Lundi 19h
    </option>

    <option value="C2">
      Bachata débutant confirmé — Lundi 20h
    </option>

    <option value="C3">
      Bachata intermédiaire — Lundi 21h
    </option>

  </select>


  <button id="start"
          onclick="demarrer()">

    📷 Autoriser la caméra

  </button>


  <button id="stop"
          onclick="arreter()">

    ⛔ Arrêter le scanner

  </button>


  <div id="reader"></div>


  <div id="message"
       class="info">

    Sélectionnez un cours puis appuyez sur
    <strong>« 📷 Autoriser la caméra »</strong>.

  </div>


<script>


/* ==================================================
1.   CONFIGURATION
================================================== */


/*
 * Adresse de ton Apps Script.
 */
const API_URL =
  "https://script.google.com/macros/s/AKfycbz-tig9GMgWGbCq7iuiiM_d68Z4z9GxPtbOinDMYksWhqR4-VCOb23UmrmT3mjeKHZm/exec";


let scanner = null;
let scannerActif = false;
let traitement = false;


/* ==================================================
2.   AFFICHAGE DES MESSAGES
================================================== */

function message(texte, type) {

  const element =
    document.getElementById("message");

  element.className = "";

  if (type) {
    element.classList.add(type);
  }

  element.innerHTML = texte;
}


/* ==================================================
3.   DEMARRAGE DE LA CAMERA
================================================== */

function demarrer() {

  const cours =
    document.getElementById("cours").value;

  if (!cours) {

    message(
      "⚠️ Veuillez d'abord choisir un cours.",
      "warning"
    );

    return;
  }

  // Évite de lancer deux caméras
  if (scannerActif) {
    return;
  }

  message(
    "📷 Demande d'autorisation de la caméra...<br><br>" +
    "Si Android affiche une demande, choisissez " +
    "<strong>Autoriser</strong>.",
    "info"
  );

  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {

    message(
      "❌ Votre navigateur ne permet pas l'accès à la caméra.",
      "error"
    );

    return;
  }

  navigator.mediaDevices.getUserMedia({

    video: {
      facingMode: {
        ideal: "environment"
      }
    },

    audio: false

  })

  .then(function(stream) {

    // On utilise uniquement cette demande pour obtenir
    // l'autorisation. Html5Qrcode ouvrira ensuite sa caméra.
    stream.getTracks().forEach(function(track) {
      track.stop();
    });

    message(
      "✅ Caméra autorisée.<br><br>" +
      "Démarrage du scanner...",
      "success"
    );

    setTimeout(function() {

      lancerScanner();

    }, 300);

  })

  .catch(function(error) {

    console.error(
      "Erreur autorisation caméra :",
      error
    );

    let texte =
      "❌ <strong>Impossible d'accéder à la caméra.</strong><br><br>";

    if (error.name === "NotAllowedError") {

      texte +=
        "L'accès à la caméra a été refusé. " +
        "Vérifiez l'autorisation de la caméra dans les réglages du navigateur.";

    }

    else if (error.name === "NotFoundError") {

      texte +=
        "Aucune caméra n'a été trouvée.";

    }

    else if (error.name === "NotReadableError") {

      texte +=
        "La caméra est déjà utilisée par une autre application.";

    }

    else if (error.name === "SecurityError") {

      texte +=
        "Le navigateur bloque l'accès à la caméra.";

    }

    else {

      texte +=
        "Erreur : " +
        error.name +
        "<br>" +
        error.message;
    }

    message(
      texte,
      "error"
    );

  });
}
/* ==================================================
4.   LANCEMENT DU SCANNER QR
================================================== */

function lancerScanner() {

  if (scannerActif) {
    return;
  }

  // Si un ancien objet existe encore, on le supprime.
  if (scanner) {
    try {
      scanner.clear();
    } catch (e) {}

    scanner = null;
  }

  scanner =
    new Html5Qrcode("reader");

  const configuration = {

    fps: 10,

    qrbox: function(width, height) {

      const taille =
        Math.min(width, height) * 0.75;

      return {
        width: Math.floor(taille),
        height: Math.floor(taille)
      };
    }

  };

  scanner.start(

    {
      facingMode: "environment"
    },

    configuration,

    function(qrCode) {

      /*
       * IMPORTANT :
       * Si un traitement est déjà en cours,
       * on ignore complètement ce QR.
       */
      if (traitement) {
        return;
      }

      /*
       * VERROUILLAGE IMMÉDIAT
       */
      traitement = true;

      console.log(
        "QR détecté : scanner verrouillé."
      );

      traiterQR(qrCode);
    },

    function() {

      // Recherche permanente d'un QR.
      // Rien à faire ici.

    }

  )

  .then(function() {

    scannerActif = true;

    document.getElementById("start")
      .style.display = "none";

    document.getElementById("stop")
      .style.display = "block";

    message(

      "📷 <strong>Scanner actif</strong><br><br>" +
      "Présentez le QR code devant la caméra.",

      "info"

    );

  })

  .catch(function(error) {

    console.error(
      "Erreur lancement scanner :",
      error
    );

    scannerActif = false;
    traitement = false;
    scanner = null;

    document.getElementById("start")
      .style.display = "block";

    document.getElementById("stop")
      .style.display = "none";

    message(

      "❌ <strong>Impossible de démarrer le scanner.</strong><br><br>" +
      String(error),

      "error"

    );

  });
}
/* ==================================================
5.   TRAITEMENT DU QR
================================================== */

function traiterQR(token) {

  const idCours =
    document.getElementById("cours").value;


  /*
   * Sécurité : normalement impossible puisque
   * le cours est contrôlé au démarrage.
   */
  if (!idCours) {

    message(
      "⚠️ Aucun cours sélectionné.",
      "warning"
    );

    libererScannerDans6Secondes();

    return;
  }


  /*
   * Le verrou est déjà actif AVANT d'arriver ici.
   */
  message(
    "⏳ Vérification du QR code...",
    "info"
  );


  const callbackName =
    "reponsePointage_" +
    Date.now();


  let termine = false;


  window[callbackName] =
    function(resultat) {

      /*
       * Protection supplémentaire :
       * si Apps Script répond deux fois,
       * on ne traite qu'une seule réponse.
       */
      if (termine) {
        return;
      }

      termine = true;


      console.log(
        "Réponse Apps Script :",
        resultat
      );


      afficherResultat(resultat);


      /*
       * Le scanner reste verrouillé.
       * Le déverrouillage est géré par une seule fonction.
       */
      libererScannerDans6Secondes();


      nettoyerJSONP();

    };


  const url =
    API_URL +
    "?token=" +
    encodeURIComponent(token) +
    "&idCours=" +
    encodeURIComponent(idCours) +
    "&callback=" +
    encodeURIComponent(callbackName);


  const script =
    document.createElement("script");


  script.src = url;


  script.onerror =
    function() {

      if (termine) {
        return;
      }

      termine = true;


      console.error(
        "Erreur de communication avec Apps Script."
      );


      message(

        "❌ <strong>Impossible de contacter Google Sheets.</strong><br><br>" +
        "Vérifiez la connexion Internet.",

        "error"

      );


      libererScannerDans6Secondes();


      nettoyerJSONP();

    };


  /*
   * Nettoyage commun.
   */
  function nettoyerJSONP() {

    try {
      delete window[callbackName];
    } catch (e) {}

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }
  }


  document.body.appendChild(script);

}

  /* ==================================================
6.   DEVERROUILLAGE APRES 6 SECONDES
================================================== */

function libererScannerDans6Secondes() {

  console.log(
    "Scanner verrouillé pendant 6 secondes."
  );


  setTimeout(function() {

    traitement = false;


    console.log(
      "Scanner à nouveau disponible."
    );


    if (scannerActif) {

      message(

        "📷 <strong>Prêt pour le prochain élève.</strong><br><br>" +
        "Présentez le QR code devant la caméra.",

        "info"

      );

    }

  }, 6000);

}

  
/* ==================================================
7.   AFFICHAGE DU RESULTAT
================================================== */

function afficherResultat(resultat) {


  if (!resultat) {

    message(
      "❌ Réponse vide du serveur.",
      "error"
    );

    return;
  }


  console.log(
    "Résultat :",
    resultat
  );


  /* -----------------------------------------------
 7.1.    SCAN VALIDE
  ------------------------------------------------ */

  if (resultat.success) {

    message(

      "<div class='nom'>" +
      "✅ " +
      resultat.eleve +
      "</div>" +

      "<strong>" +
      resultat.message +
      "</strong>" +

      "<br><br>" +

      "Cours : <strong>" +
      resultat.cours +
      "</strong>" +

      "<div class='credits'>" +
      "Crédits restants : " +
      resultat.creditsApres +
      "</div>" +

      "<br>" +

      "Carte valable jusqu'au " +
      "<strong>" +
      resultat.dateFin +
      "</strong>",

      "success"

    );

    return;
  }


  /* -----------------------------------------------
  7.2.   DOUBLE SCAN
  ------------------------------------------------ */

  if (resultat.type === "duplicate") {

    message(

      "⚠️ <strong>" +
      (resultat.eleve || "") +
      "</strong><br><br>" +

      resultat.message +

      "<br><br>" +

      "Crédits restants : " +
      (resultat.credits || ""),

      "warning"

    );

    return;
  }


  /* -----------------------------------------------
  7.3.   CARTE EPUISEE
  ------------------------------------------------ */

  if (resultat.type === "empty") {

    message(

      "❌ <strong>" +
      (resultat.eleve || "") +
      "</strong><br><br>" +

      resultat.message,

      "error"

    );

    return;
  }


  /* -----------------------------------------------
  7.4.   CARTE INEXISTANTE / HORS PERIODE
  ------------------------------------------------ */

  if (resultat.type === "expired") {

    message(

      "❌ <strong>" +
      (resultat.eleve || "") +
      "</strong><br><br>" +

      resultat.message,

      "error"

    );

    return;
  }


  /* -----------------------------------------------
  7.5.   AUTRE ERREUR
  ------------------------------------------------ */

  message(

    "❌ " +
    (resultat.message ||
     "QR code refusé."),

    "error"

  );

}



/* ==================================================
8.   ARRET DU SCANNER
================================================== */

function arreter() {

  if (!scanner || !scannerActif) {
    return;
  }


  scanner.stop()


  .then(function() {

    scanner.clear();


    scanner = null;

    scannerActif = false;

    traitement = false;


    document.getElementById("start")
      .style.display = "block";


    document.getElementById("stop")
      .style.display = "none";


    message(

      "Scanner arrêté.<br><br>" +
      "Vous pouvez redémarrer la caméra.",

      "info"

    );

  })


  .catch(function(error) {

    console.error(error);

  });

}


</script>

</body>
</html>
